<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações - Gemini Screen Translator</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #08080a;
      --subtle-bg: #0d0d10;
      --input-bg: #0d0d10;
      --shortcut-bg: #000000;
      --border: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-input: rgba(255, 255, 255, 0.12);
      --border-focus: #ffffff;
      --text: #ededed;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 1. Top Header */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.95);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-avatar {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #000000;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-transform: uppercase;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: normal;
    }

    .link-btn {
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.12s;
      padding: 0;
    }

    .link-btn:hover {
      color: #ffffff;
    }

    /* Card Panels */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-family: var(--font-mono);
    }

    .card-header a {
      font-size: 10.5px;
      color: var(--text-muted);
      text-decoration: underline;
      font-family: var(--font-mono);
      transition: color 0.12s;
    }

    .card-header a:hover {
      color: #ffffff;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 10.5px;
      font-weight: 600;
      color: #d4d4d8;
      text-transform: uppercase;
      font-family: var(--font-mono);
      letter-spacing: 0.4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border-input);
      padding: 6px 10px;
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.12s;
    }

    select {
      font-family: var(--font-sans);
      cursor: pointer;
    }

    input:focus,
    select:focus {
      border-color: var(--border-focus);
    }

    .toggle-visibility-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-visibility-btn:hover {
      color: #ffffff;
    }

    /* Buttons */
    .btn-secondary {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border-input);
      background: var(--subtle-bg);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.12s;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #15151a;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-save-full {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border-input);
      background: var(--subtle-bg);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.12s;
    }

    .btn-save-full:hover:not(:disabled) {
      background: #15151a;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-save-full:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Grid Layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 540px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Shortcut Boxes */
    .shortcut-box {
      background: var(--subtle-bg);
      padding: 10px;
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .shortcut-box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .shortcut-box-top strong {
      font-size: 11.5px;
      color: #e4e4e7;
    }

    .shortcut-box-top span {
      font-size: 9.5px;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }

    .shortcut-input {
      background: var(--shortcut-bg) !important;
      border: 1px solid var(--border-input) !important;
      font-family: var(--font-mono) !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      padding: 6px 8px !important;
      outline: none;
    }

    .shortcut-input:focus {
      border-color: var(--border-focus) !important;
    }

    /* Status Notifications Box */
    .status-container {
      min-height: 38px;
    }

    .status-box {
      padding: 10px;
      font-size: 11.5px;
      line-height: 1.4;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      background: var(--subtle-bg);
    }

    .status-idle {
      padding: 8px;
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      border: 1px dashed rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .status-success {
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
      background: #0d0d10;
    }

    .status-error {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
      background: #150a0a;
    }

    .status-info {
      color: #d4d4d8;
      border-color: rgba(255, 255, 255, 0.2);
      background: #0d0d10;
    }

    .status-close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      margin-left: 8px;
    }

    .status-close-btn:hover {
      color: #ffffff;
    }

    /* Audit Panel */
    .audit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .audit-subtitle {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .audit-actions {
      display: flex;
      gap: 6px;
    }

    .btn-micro {
      background: #000000;
      color: #d4d4d8;
      border: 1px solid var(--border-input);
      font-size: 10px;
      padding: 3px 8px;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.12s;
    }

    .btn-micro:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .audit-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .audit-empty {
      font-size: 10.5px;
      color: var(--text-dim);
      text-align: center;
      padding: 10px 4px;
      font-family: var(--font-mono);
    }

    .audit-row {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 5px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .audit-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .audit-tag {
      padding: 1px 4px;
      font-size: 9px;
      font-weight: bold;
    }

    .audit-tag-success {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .audit-tag-error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .audit-row-desc {
      color: var(--text-muted);
      font-size: 9.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Header com Avatar Oficial e Badges -->
    <header class="header-card">
      <div class="header-row">
        <div class="brand-group">
          <img src="icons/icon-48.png" alt="G.S.T Robot" class="brand-avatar" id="brandAvatar" />
          <h1 class="brand-title">
            <span>Configurações</span>
            <span class="badge" id="addonVersionBadge">v1.0.0</span>
            <span class="badge">Firefox MV3</span>
          </h1>
        </div>

        <button type="button" class="link-btn" id="resetShortcutsTopBtn" title="Restaurar atalhos de teclado para os valores padrão">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Restaurar Atalhos</span>
        </button>
      </div>
    </header>

    <!-- Formulário Principal -->
    <form id="optionsForm" style="display: flex; flex-direction: column; gap: 16px;">
      <!-- Bloco: Credenciais Google Gemini -->
      <section class="card">
        <div class="card-header">
          <div class="card-title-group">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21 2-2 2m-6 6 2-2m-8 8a6 6 0 1 1 8.49-8.49L21 2l1 1-1 1 2 2-1 1 1 1-6.51 6.51A6 6 0 0 1 6 18Z"/>
            </svg>
            <h2 class="card-title">Credenciais da API (Google Gemini)</h2>
          </div>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">
            Gerar chave gratuita ↗
          </a>
        </div>

        <div class="input-wrapper">
          <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off" required aria-describedby="apiKeyHelp" />
          <button type="button" class="toggle-visibility-btn" id="toggleVisibility" title="Mostrar/ocultar chave">👁</button>
        </div>

        <div>
          <button type="button" id="testConnectionBtn" class="btn-secondary">
            Testar Conexão Gemini
          </button>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="targetLanguage">Idioma de Destino</label>
            <select id="targetLanguage">
              <option value="Português do Brasil" selected>Português do Brasil</option>
              <option value="Inglês">Inglês</option>
              <option value="Espanhol">Espanhol</option>
              <option value="Francês">Francês</option>
              <option value="Alemão">Alemão</option>
              <option value="Japonês">Japonês</option>
            </select>
          </div>

          <div class="form-group">
            <label for="geminiModel">Modelo do Gemini</label>
            <select id="geminiModel">
              <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite</option>
              <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Bloco: Atalhos de Teclado -->
      <section class="card">
        <div class="card-header">
          <div class="card-title-group">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="0"/>
              <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/>
            </svg>
            <h2 class="card-title">Atalhos de Teclado</h2>
          </div>
          <button type="button" class="link-btn" id="resetShortcutsCardBtn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            <span>Restaurar Atalhos</span>
          </button>
        </div>

        <div class="grid-2">
          <div class="shortcut-box">
            <div class="shortcut-box-top">
              <strong>Atalho 1: Captura Livre</strong>
              <span>toggle-selection</span>
            </div>
            <input type="text" id="shortcutFree" class="shortcut-input" placeholder="Alt+Shift+T" />
          </div>

          <div class="shortcut-box">
            <div class="shortcut-box-top">
              <strong>Atalho 2: Zona Fixa</strong>
              <span>repeat-fixed-selection</span>
            </div>
            <input type="text" id="shortcutFixed" class="shortcut-input" placeholder="Alt+Shift+Q" />
          </div>
        </div>
      </section>

      <!-- Botão de Ação: Ocupa todo o espaço (100% largura) -->
      <div>
        <button type="submit" class="btn-save-full" id="saveBtn">
          Salvar Preferências
        </button>
      </div>

      <!-- Feedback de Status Fixo sem deslocamento -->
      <div class="status-container" id="statusContainer">
        <div class="status-idle" id="statusIdle">
          Nenhuma alteração pendente
        </div>
        <div class="status-box" id="statusBox" style="display: none;" role="status" aria-live="polite">
          <span id="statusMessage" style="font-weight: bold;"></span>
          <button type="button" class="status-close-btn" id="statusCloseBtn" title="Fechar alerta">✕</button>
        </div>
      </div>
    </form>

    <!-- Auditoria de Requisições para Transparência & Revisão Mozilla AMO -->
    <section class="card">
      <div class="audit-header">
        <span class="audit-subtitle">Auditoria de Requisições (Logs Locais da API)</span>
        <div class="audit-actions">
          <button type="button" class="btn-micro" id="refreshAuditBtn">Atualizar</button>
          <button type="button" class="btn-micro" id="clearAuditBtn">Limpar</button>
        </div>
      </div>
      <div id="auditLogList" class="audit-list" role="log" aria-live="polite"></div>
    </section>
  </div>

  <script src="options.js"></script>
</body>
</html>
